# Valkey server certificate, produces a secret with ca.crt/tls.crt/tls.key,
# exactly what the Valkey CR's spec.TLS expects (see wave2-valkey-instance.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.valkey.tlsSecretName }}
  namespace: {{ include "idig.namespace" . }}
  labels:
    app.kubernetes.io/component: middleware
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: {{ .Values.valkey.tlsSecretName }}
    {{- include "idig.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  subject:
    organizations:
      - cert-manager
  commonName: {{ printf "valkey.%s.svc.cluster.local" (include "idig.namespace" .) }}
  dnsNames:
    - {{ printf "valkey.%s.svc.cluster.local" (include "idig.namespace" .) }}
    - {{ printf "valkey.%s.svc" (include "idig.namespace" .) }}
  secretName: {{ .Values.valkey.tlsSecretName }}
  issuerRef:
    name: {{ .Values.issuer.name }}
    kind: {{ .Values.issuer.kind }}
  usages:
    - "server auth"
    - "client auth"
    - "signing"
    - "key encipherment"
  duration: 17520h # 2 years
  renewBefore: 720h # 30 days
  privateKey:
    rotationPolicy: Always
    encoding: PKCS8
  secretTemplate:
    labels:
      app.kubernetes.io/component: middleware
      app.kubernetes.io/instance: valkey
      app.kubernetes.io/name: {{ .Values.valkey.tlsSecretName }}
{{- end }}
