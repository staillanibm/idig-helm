{{- $wave := include "idig.wave" . }}
{{- if or (eq $wave "0") (eq $wave "all") }}
# Wave 0 -- Application leaf Certificates for IDIG's internal mTLS.
# All issued from `issuer.name`/`issuer.kind` (see values.yaml) -- switching
# to a cluster-level issuer only ever means changing those two values in
# wave0-issuers.yaml, not this file.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: portal-admin-client
  namespace: {{ include "idig.namespace" . }}
  labels:
    app.kubernetes.io/component: management
    app.kubernetes.io/instance: management
    app.kubernetes.io/name: portal-admin-client
    {{- include "idig.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  subject:
    organizations:
    - cert-manager
  commonName: portal-admin-client
  secretName: portal-admin-client
  issuerRef:
    name: {{ .Values.issuer.name }}
    kind: {{ .Values.issuer.kind }}
  usages:
  - "client auth"
  - "signing"
  - "key encipherment"
  duration: 17520h # 2 years
  renewBefore: 720h # 30 days
  privateKey:
    rotationPolicy: Always
    encoding: PKCS8
  secretTemplate:
    labels:
      app.kubernetes.io/component: management
      app.kubernetes.io/instance: management
      app.kubernetes.io/name: portal-admin-client
