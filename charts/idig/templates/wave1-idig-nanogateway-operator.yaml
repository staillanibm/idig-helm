{{- $wave := include "idig.wave" . }}
{{- if and .Values.idigNanoGatewayOperator.enabled (or (eq $wave "1") (eq $wave "all")) }}
{{- include "idig.validateOperatorScope" . }}
{{- include "idig.validateImagePullSecret" . }}
# Wave 1 -- IDIG NanoGateway operator.
# Reuses the "datapower-nano-operator" ServiceAccount/RBAC created by the
# NanoGateway operator (same wave) -- no separate RBAC needed for this
# Deployment. No dependency on Valkey/the IDIG cluster CR at startup --
# this is a standard controller waiting for CRs, safe to start alongside
# every other operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idig-gw-operator
  namespace: {{ include "idig.namespace" . }}
  labels:
    app.kubernetes.io/name: idig-gw-operator
    {{- include "idig.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idig-gw-operator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idig-gw-operator
    spec:
      {{- if .Values.global.enforceAmd64NodeAffinity }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      {{- end }}
      containers:
      - env:
        - name: RUST_LOG
          value: idig_operator=info
        - name: RUST_BACKTRACE
          value: "1"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.idigNanoGatewayOperator.image }}"
        imagePullPolicy: Always
        name: datapower-idig-operator
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      {{- include "idig.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
      serviceAccountName: datapower-nano-operator
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: idig-gw-operator
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
{{- end }}
