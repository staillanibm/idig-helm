apiVersion: v2
name: idig
description: >
  IBM DataPower Interact Gateway (IDIG) 12.1.1 -- operators, dependencies
  (API Connect, NanoGateway, Valkey) and the DatapowerInteractGatewayCluster
  custom resource, deployed wave by wave for OpenShift/Kubernetes.
type: application
version: 0.1.0
appVersion: "12.1.1.2"
kubeVersion: ">=1.27.0-0"
keywords:
  - ibm
  - datapower
  - apiconnect
  - idig
  - gitops
maintainers:
  - name: IDIG Platform Team
dependencies:
  - name: idig-crds
    version: "0.1.0"
    repository: "file://charts/idig-crds"
    condition: idig-crds.enabled
  - name: idig-crds-vendor
    version: "0.1.0"
    repository: "file://charts/idig-crds-vendor"
    condition: idig-crds-vendor.enabled
