apiVersion: v2
name: idig-crds
description: >
  CRDs for the IDIG chart (NanoGateway, Valkey, IDIG operator), packaged as
  an unmanaged sub-chart so they are applied once at first install without
  bloating the parent chart's Helm release Secret (the 1 MiB Kubernetes
  object size limit). See charts/idig/AGENTS.md-referenced notes for why
  this sub-chart exists.
type: application
version: 0.1.0
