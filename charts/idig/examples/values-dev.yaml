# Development profile -- minimal resources.
# Maps to the vendor bundle's samples/idig-cluster.yaml (profile: dev).
#
# Usage:
#   helm upgrade --install idig-prereqs charts/idig -f charts/idig/examples/values-dev.yaml \
#     --set deployment.wave=0 -n idig --create-namespace

global:
  namespace: idig
  imageRegistry: "quay-quay-quay.apps.itz-iscex5.infra01-lb.fra02.techzone.ibm.com/idig" # REQUIRED: set to your mirrored registry (see scripts/mirror-images.sh)
  imagePullSecret: "idig-registry-secret" # REQUIRED here: target cluster is not the same cluster as the registry, so same-namespace-only pull doesn't apply
  # Base domain for ingress endpoints. No custom domain is imposed: this is
  # the cluster's own ingress domain (what `make fill-values` auto-detects
  # via `oc get ingresses.config/cluster`), so routes resolve through the
  # OCP wildcard DNS with no external DNS setup.
  domain: "apps.itz-iscex5.infra01-lb.fra02.techzone.ibm.com" # REQUIRED: base domain for ingress endpoints
  license:
    accept: true # REQUIRED: set to true to accept the IBM license
idigCluster:
  profile: dev
  # Analytics/OpenSearch is always deployed by the IDIG operator regardless
  # of this flag -- it only toggles analytics-proxy/analytics-ui and a
  # "minimal analytics configuration" mode. Set to true only if you need
  # those UI/proxy components; it does not change Analytics' own resource
  # footprint (see analyticsStorage below for that).
  enableAnalytics: true
  enableDevPortal: true
  tenantName: "idig"
  groupName: "dev"
  # analyticsSettings.clientSubjectDN is only required when enableAnalytics: true.
  # The default in values.yaml is correct (RFC 2253 CN-first order); override here
  # if your cert-manager issuer produces a different subject DN.
  # analyticsSettings:
  #   clientSubjectDN: "CN=analytics-ingestion-client,O=cert-manager"

  # values.yaml's chart-wide default (200Gi) is sized for prod, not dev.
  # The IDIG operator scales Analytics/OpenSearch's own memory request
  # roughly in proportion to this volume size (observed: 200Gi -> 6Gi
  # memory request, 5Gi -> 3Gi) -- reducing it here is the effective lever
  # for a dev cluster's resource footprint, since enableAnalytics itself
  # is not (see above).
  analyticsStorage:
    volumeSize: 50Gi
  devPortalStorage:
    volumeSize: 20Gi

  # TLS: self-signed. Nothing to set here -- the wave 0 Issuer/CA
  # (selfsigning-issuer -> ingress-ca -> ingress-issuer) issues every IDIG
  # certificate, and the NanoGateway route keeps the chart-default
  # self-signed nanogw-gateway-ca-cert. Clients must trust the generated CA
  # (or skip verification) -- there is no publicly-trusted cert in this
  # profile. customIngressCertificate is deliberately left unset.
  #
  # nanoGateway.gatewayDomain is also left unset: the chart then defaults to
  # "idig.<global.domain>" (vendor default since 12.1.1.3), which the
  # admission webhook accepts as it differs from global.domain.
envoyGateway:
  enabled: false
